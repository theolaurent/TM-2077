<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TM-2077 · Tuner / Metronome</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link data-trunk rel="rust" data-wasm-opt="2" />

    <style>
      html,
      body {
        overflow: hidden;
        margin: 0 !important;
        padding: 0 !important;
        width: 100%;
        height: 100%;
        background: #0d0f0e;
      }

      canvas {
        margin-right: auto;
        margin-left: auto;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* Loading text shown until wasm boots. */
      .loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6a6f6b;
        font-family: monospace;
        font-size: 1rem;
      }
    </style>
  </head>

  <body>
    <div class="loading" id="loading">booting TM-2077…</div>
    <canvas id="the_canvas_id"></canvas>
  </body>
</html>
