[package]
name = "tm2077"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = "0.35"
log = "0.4"
serde = { version = "1", features = ["derive"] }
# cpal drives the metronome (audio output) on BOTH native and web.
cpal = "0.15"
# Shared pitch detection for the tuner (McLeod / MPM), WASM-compatible.
pitch-detection = "0.3"
# Error handling. This project is strictly no-panic (see AGENTS.md): every
# fallible operation returns `anyhow::Result` and is propagated with `?`.
anyhow = "1"
# Persistent data structures for the functional-first style (see AGENTS.md):
# copy-on-write collections with cheap structural-sharing clones.
imbl = "7"

# --- Native-only (desktop) ---
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Linux/desktop windowing backends for winit (not needed on web).
eframe = { version = "0.35", default-features = false, features = ["x11", "wayland"] }
env_logger = "0.11"

# --- Web-only (wasm via trunk) ---
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Enable cpal's WebAudio output backend.
cpal = { version = "0.15", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# web-sys is needed ONLY for the web tuner's mic capture (cpal has no released
# WASM input backend), so only the getUserMedia + AnalyserNode surface is enabled.
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Navigator",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "MediaStreamAudioSourceNode",
    "AudioContext",
    "AudioContextState",
    "BaseAudioContext",
    "AudioNode",
    "AnalyserNode",
] }

# Crate-wide lints (see AGENTS.md). The no-panic policy is enforced by the
# clippy restriction lints below; `unsafe_code` is forbidden outright. Kept here
# rather than as crate-level `#![...]` attributes so the policy lives in one
# place. `#[cfg(test)]` modules are exempt from the restriction lints, so CI runs
# clippy on the shipping targets only (no `--all-targets`).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# `priority = -1` lets the specific restriction lints below override the group.
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"

[profile.release]
opt-level = 2
lto = "thin"

# Slightly optimize deps in dev so audio/DSP isn't sluggish.
[profile.dev.package."*"]
opt-level = 2
